<!doctype html>
<html lang="ru">
<head>

<title data-i18n="success.title">Оплата прошла</title>
<meta name="robots" content="noindex,nofollow">

<script src="assets/js/app.js?v=2" defer></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-tg" viewBox="0 0 24 24"><path d="M21 4.5 2.9 11.4c-1 .4-1 1.8.1 2l4.5 1.3 1.7 5.1c.3.8 1.3 1 1.9.4l2.5-2.4 4.6 3.4c.7.5 1.7.1 1.9-.7L22.9 5.6c.2-.9-.7-1.5-1.5-1.1Z" fill="currentColor"/></symbol>
</svg>

<header class="nav">
  <div class="wrap wrap--wide nav__in">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
      VolFix <span class="brand__sfx">Global</span>
    </a>
    <div class="nav__right">
      <div class="lang" role="group" aria-label="Язык / Тіл">
        <button type="button" class="lang__btn" data-lang="ru">RU</button>
        <button type="button" class="lang__btn" data-lang="kk">KZ</button>
      </div>
    </div>
  </div>
</header>

<main class="done" data-success>
  <span class="done__ic"><svg width="32" height="32"><use href="#i-check"></use></svg></span>
  <h1 data-i18n="success.h1">Доступ открыт.</h1>
  <p class="done__sub" data-i18n="success.sub">Ниже — персональная ссылка-приглашение в закрытую группу.</p>

  <div class="linkbox">
    <p class="linkbox__l" data-i18n="success.linkLabel">Ваша ссылка в Telegram</p>
    <div class="linkbox__v">
      <code data-invite>https://t.me/+DEMO_INVITE_LINK_PLACEHOLDER</code>
      <button type="button" data-copy data-i18n="success.copy">Скопировать</button>
    </div>
    <!-- Заглушка: реальная одноразовая ссылка придёт из Telegram Bot API
         (createChatInviteLink, member_limit=1) после вебхука об оплате. -->
    <div class="stub" style="margin-bottom:0"><p data-i18n="success.stub"></p></div>
  </div>

  <a class="btn btn--lg" data-link="telegram" href="#" target="_blank" rel="noopener" data-i18n="success.open">Открыть Telegram</a>

  <p class="done__note" data-i18n="success.mail">Копию ссылки продублируем на почту и в SMS.</p>
  <p class="done__note" data-i18n="success.volfix">Инструкция по активации VolFix — внутри группы.</p>
  <p class="done__note"><a class="tlink" href="index.html" data-i18n="success.back">Вернуться на сайт</a></p>
</main>

</body>
</html>
